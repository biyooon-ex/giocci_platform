name: Docker Build Test

on:
  push:
    paths:
      - "VERSIONS"
      - "Dockerfile"
      - "docker-compose.yml"
      - "apps/*/Dockerfile"
      - "apps/*/docker-compose.yml"
      - "bin/build_and_push_app_images.sh"
  pull_request:
    paths:
      - "VERSIONS"
      - "Dockerfile"
      - "docker-compose.yml"
      - "apps/*/Dockerfile"
      - "apps/*/docker-compose.yml"
      - "bin/build_and_push_app_images.sh"

jobs:
  build_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [zenohd, giocci, giocci_engine, giocci_relay]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test for ${{ matrix.app }} image
        run: |
          ./bin/build_and_push_app_images.sh --dry-run ${{ matrix.app }}
