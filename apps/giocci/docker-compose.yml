services:
  giocci:
    image: ghcr.io/biyooon-ex/giocci_platform/giocci:${PROJECT_VERSION}
    build:
      context: ../../
      dockerfile: ./apps/giocci/Dockerfile
      platforms:
        - "linux/amd64"
        - "linux/arm64"
      args:
        ELIXIR_VERSION: ${ELIXIR_VERSION}
        ERLANG_VERSION: ${ERLANG_VERSION}
        UBUNTU_VERSION: ${UBUNTU_VERSION}
    volumes:
      - ./config/giocci.exs:/app/giocci.exs:ro
      - ./config/zenoh.json5:/app/zenoh.json5:ro
    restart: "always"
    stdin_open: true
    tty: true
