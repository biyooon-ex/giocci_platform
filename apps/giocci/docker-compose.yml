services:
  giocci:
    image: ghcr.io/biyooon-ex/giocci_platform/giocci:0.3.1
    build:
      context: ../../
      dockerfile: ./apps/giocci/Dockerfile
      platforms:
        - "linux/amd64"
        - "linux/arm64"
    volumes:
      - ./config/giocci.exs:/app/giocci.exs:ro
      - ./config/zenoh.json5:/app/zenoh.json5:ro
    environment:
      - ZENOHD_CONNECT_ENDPOINTS
    restart: "always"
    stdin_open: true
    tty: true
