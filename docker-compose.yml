services:
  zenohd:
    build:
      context: .
      platforms:
        - "linux/amd64"
        - "linux/arm64"
    image: ghcr.io/biyooon-ex/giocci_platform/zenohd:1.10.2
    volumes:
      - .:/app
      # Avoid sharing platform-specific NIF/build artifacts with the host.
      - /app/_build
    ports:
      - "7447:7447"
      - "7446:7446/udp"
