version: 2
updates:
  - package-ecosystem: "mix"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # zenohex is pinned via VERSIONS and must be updated together with
      # ZENOH_VERSION (Zenoh daemon) and tested manually due to native Rust components.
      - dependency-name: "zenohex"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10