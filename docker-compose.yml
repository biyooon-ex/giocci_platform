services:
  zenohd:
    build:
      context: .
      args:
        ELIXIR_VERSION: ${ELIXIR_VERSION}
        ERLANG_VERSION: ${ERLANG_VERSION}
        UBUNTU_VERSION: ${UBUNTU_VERSION}
        ZENOH_VERSION: ${ZENOH_VERSION}
      platforms:
        - "linux/amd64"
        - "linux/arm64"
    image: ghcr.io/biyooon-ex/giocci_platform/zenohd:${ZENOH_VERSION}
    volumes:
      - .:/app
    ports:
      - "7447:7447"
      - "7446:7446/udp"
